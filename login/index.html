<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado | Monkeytools</title><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#061525 url('/assets/portada.webp') center/cover fixed;color:white;font-family:system-ui,Arial,sans-serif}main{width:min(440px,92vw);border:1px solid #5acbb644;border-radius:22px;background:#041523ed;padding:36px;box-shadow:0 15px 60px #0007;text-align:center}img{width:110px;max-height:120px;object-fit:contain}h1{font-size:2.3rem;margin:5px 0 0;letter-spacing:-.05em}h1 span{color:#72e0d3}p{color:#c3dce3}label{display:block;text-align:left;margin:17px 0 6px}input{width:100%;border-radius:10px;border:1px solid #577989;background:#061e31;color:white;padding:13px;font:inherit}button{width:100%;border:0;border-radius:10px;background:#72e0d3;color:#061525;padding:14px;margin-top:22px;font-size:1rem;font-weight:750;cursor:pointer}button:disabled{opacity:.55}#status{min-height:22px;color:#ffb4b4;font-size:.9rem}</style></head><body><main><img src="/assets/monkeytools-logo.svg" alt="Logotipo Monkeytools"><h1>Monkey<span>tools</span></h1><p>by Makako Team · Acceso privado</p><form id="login"><label for="username">Usuario</label><input id="username" autocomplete="username" required minlength="3" maxlength="40"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Iniciar sesión</button><p id="status" role="status" aria-live="polite"></p></form></main><script type="module" src="../src/login.ts"></script></body></html>
