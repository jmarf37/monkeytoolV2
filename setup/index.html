<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monkeytools</title><link rel="icon" type="image/svg+xml" href="/assets/monkeytools-logo.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061525;color:#fff;font-family:system-ui,sans-serif}main{width:min(480px,94vw);border:1px solid #355a69;background:#081d30;border-radius:20px;padding:30px}h1{margin:0;color:#72e0d3}p{line-height:1.5;color:#bcd2da}label{display:block;margin:16px 0 5px}input{width:100%;background:#031320;color:#fff;border:1px solid #527487;border-radius:9px;padding:12px;font:inherit}button{margin-top:22px;width:100%;background:#72e0d3;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}#status{min-height:28px;color:#ffb1b1}</style></head><body><main><h1>Monkeytools</h1><p>Instalación inicial de la cuenta administradora. Utiliza el token temporal configurado como secreto en Cloudflare. No guardamos tu contraseña en el repositorio.</p><form id="setup"><label for="token">Token temporal de instalación</label><input type="password" id="token" autocomplete="off" required><label for="username">Nombre de usuario</label><input id="username" autocomplete="username" required minlength="3" maxlength="40" value="admin"><label for="password">Contraseña nueva (mínimo 16 caracteres)</label><input id="password" type="password" autocomplete="new-password" required minlength="16"><label for="confirm">Repetir contraseña</label><input id="confirm" type="password" autocomplete="new-password" required minlength="16"><button type="submit">Crear administrador</button><p id="status" role="status" aria-live="polite"></p></form></main><script type="module" src="../src/setup.ts"></script></body></html>
